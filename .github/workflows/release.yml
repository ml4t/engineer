name: Release

on:
  push:
    tags: ["v*"]

jobs:
  ecosystem-qualification:
    name: Ecosystem Qualification
    permissions:
      contents: read
    uses: ml4t/ecosystem/.github/workflows/qualify-library.yml@457678d8860d0c816b1dc376e7e2691daa93af4d # v0.1.0
    with:
      import-package: ml4t.engineer
      prerelease-exception: python-315-polars

  qualification:
    name: Qualify Release
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [ecosystem-qualification, qualification]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "${{ github.ref_name }}"
          --generate-notes
          --verify-tag
