name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      candidate_commit:
        description: Full commit SHA currently at the tip of main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release Request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tree: ${{ steps.identity.outputs.tree }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
      - name: Require the current main commit and an unused version
        id: identity
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_commit must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "version must be a stable or prerelease PEP 440 version" >&2
            exit 1
          fi
          git fetch origin main --no-tags
          if [[ "$(git rev-parse HEAD)" != "$CANDIDATE_COMMIT" ]] || \
             [[ "$(git rev-parse origin/main)" != "$CANDIDATE_COMMIT" ]]; then
            echo "candidate_commit must be the current main revision" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v${RELEASE_VERSION}" || \
             gh release view "v${RELEASE_VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "tag or GitHub release v${RELEASE_VERSION} already exists" >&2
            exit 1
          fi
          python scripts/ci/release.py require-absent ml4t-engineer "$RELEASE_VERSION"
          echo "commit=$CANDIDATE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  ecosystem-qualification:
    name: Ecosystem Qualification
    needs: validate
    permissions:
      contents: read
    uses: ml4t/ecosystem/.github/workflows/qualify-library.yml@457678d8860d0c816b1dc376e7e2691daa93af4d # v0.1.0
    with:
      import-package: ml4t.engineer
      prerelease-exception: python-315-polars

  select-candidate:
    name: Select Qualified Candidate
    runs-on: ubuntu-latest
    needs: [validate, ecosystem-qualification]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - name: Find successful main CI run
        id: ci-run
        env:
          CANDIDATE_COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow ci.yml \
            --commit "$CANDIDATE_COMMIT" \
            --branch main \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          if [[ -z "$run_id" ]]; then
            echo "No successful main CI run exists for $CANDIDATE_COMMIT" >&2
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download qualified release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "${{ steps.ci-run.outputs.run-id }}"
          --repo "${{ github.repository }}"
          --name release-candidate
          --dir candidate
      - name: Verify candidate commit, tree, version, and SHA256 manifest
        run: >-
          python scripts/ci/candidate.py verify candidate
          --expected-commit "${{ needs.validate.outputs.commit }}"
          --expected-tree "${{ needs.validate.outputs.tree }}"
          --expected-tag "v${{ needs.validate.outputs.version }}"
      - name: Retain selected candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-release-candidate
          path: candidate/
          if-no-files-found: error

  docs:
    name: Publish Qualified Documentation
    runs-on: ubuntu-latest
    needs: [validate, select-candidate]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.9"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-release-candidate
          path: candidate
      - name: Verify selected candidate
        run: >-
          python scripts/ci/candidate.py verify candidate
          --expected-commit "${{ needs.validate.outputs.commit }}"
          --expected-tree "${{ needs.validate.outputs.tree }}"
          --expected-tag "v${{ needs.validate.outputs.version }}"
      - name: Build revision-identified documentation
        env:
          ML4T_DOCS_COMMIT: ${{ needs.validate.outputs.commit }}
          ML4T_DOCS_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          uv sync --dev --extra docs --python 3.12
          uv run mkdocs build --strict
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("site/release.json").write_text(
              json.dumps(
                  {
                      "commit": os.environ["ML4T_DOCS_COMMIT"],
                      "library": "engineer",
                      "version": os.environ["ML4T_DOCS_VERSION"],
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - name: Require deploy credentials
        env:
          DOCS_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: |
          if [[ -z "$DOCS_DEPLOY_KEY" ]]; then
            echo "DOCS_DEPLOY_KEY is required for a stable release" >&2
            exit 1
          fi
      - name: Deploy stable documentation
        uses: cpina/github-action-push-to-another-repository@55306faa4ed53b815ae49e564af8cfb359d32ae2 # v1.7.3
        env:
          SSH_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        with:
          source-directory: site/
          destination-github-username: ml4t
          destination-repository-name: website
          target-directory: static/docs/engineer/
          target-branch: main
          commit-message: "docs(engineer): publish v${{ needs.validate.outputs.version }} from ${{ needs.validate.outputs.commit }}"
          user-name: ml4t-bot
          user-email: bot@ml4trading.io
      - name: Deploy versioned documentation
        uses: cpina/github-action-push-to-another-repository@55306faa4ed53b815ae49e564af8cfb359d32ae2 # v1.7.3
        env:
          SSH_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        with:
          source-directory: site/
          destination-github-username: ml4t
          destination-repository-name: website
          target-directory: static/docs/engineer/releases/${{ needs.validate.outputs.version }}/
          target-branch: main
          commit-message: "docs(engineer): retain v${{ needs.validate.outputs.version }} from ${{ needs.validate.outputs.commit }}"
          user-name: ml4t-bot
          user-email: bot@ml4trading.io
      - name: Verify deployed documentation identity
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: uv run python scripts/ci/verify_docs_deployment.py

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [validate, ecosystem-qualification, select-candidate, docs]
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-release-candidate
          path: candidate
      - name: Publish the qualified artifacts
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: candidate/dist/
          print-hash: true

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, publish]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-release-candidate
          path: candidate
      - name: Create tag and GitHub release from the candidate commit
        env:
          CANDIDATE_COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          args=(
            "v${RELEASE_VERSION}"
            --repo "${{ github.repository }}"
            --target "$CANDIDATE_COMMIT"
            --generate-notes
            candidate/dist/*
            candidate/candidate.json
          )
          if [[ "$RELEASE_VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"

  verify-release:
    name: Verify Published Release
    runs-on: ubuntu-latest
    needs: [validate, github-release]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.9"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-release-candidate
          path: candidate
      - name: Verify PyPI metadata and artifact SHA256 digests
        run: python scripts/ci/release.py verify candidate
      - name: Install the published wheel and run the README quick start
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: >-
          uv run --isolated --no-project
          --with "ml4t-engineer==${RELEASE_VERSION}"
          python tests/documentation_workflows.py --readme-only
      - name: Verify GitHub release artifacts against the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p released/dist
          gh release download "v${RELEASE_VERSION}" --repo "${{ github.repository }}" \
            --pattern candidate.json --dir released
          gh release download "v${RELEASE_VERSION}" --repo "${{ github.repository }}" \
            --pattern '*.whl' --pattern '*.tar.gz' --dir released/dist
          python scripts/ci/candidate.py verify released \
            --expected-commit "${{ needs.validate.outputs.commit }}" \
            --expected-tree "${{ needs.validate.outputs.tree }}" \
            --expected-tag "v${RELEASE_VERSION}"
      - name: Repeat deployed documentation identity check
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: python scripts/ci/verify_docs_deployment.py
